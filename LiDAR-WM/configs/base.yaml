data:
  root: $AUDIO_LIDAR_DATA_ROOT
  # 44.1 kHz / 3 = 14.7 kHz; preserves useful array cues while reducing FFT cost.
  audio_stride: 3
  max_train_samples: null
  max_val_samples: null

model:
  base_channels: 32
  audio_dim: 160
  num_categories: 16
  lidar_width: 1800
  audio_sample_rate: 14700
  n_fft: 256
  hop_length: 128
  attention_heads: 5

loss:
  segmentation: 1.0
  dice: 1.0
  renderer: 0.25
  consistency: 0.1
  doa: 0.15
  category: 0.1
  semantic: 0.25
  position: 0.2
  smoothness: 0.02
  sparsity: 0.02

training:
  seed: 1337
  epochs: 100
  batch_size: 2
  val_batch_size: 2
  gradient_accumulation: 4
  learning_rate: 0.0003
  weight_decay: 0.05
  warmup_epochs: 5
  clip_grad_norm: 1.0
  num_workers: 4
  amp: true
  require_cuda: true
  early_stopping_patience: 15
  resume: null

evaluation:
  # Selection happens only on validation; use the selected threshold once on test.
  thresholds: [0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70]

output_dir: runs/lawm-semantic
