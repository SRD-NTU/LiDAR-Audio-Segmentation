data:
  root: $AUDIO_LIDAR_DATA_ROOT
  audio_stride: 3
  feature_root: cache/clap
  geometry_feature_root: cache/sonata-xyz-v2
  equivariant_augmentation: true
  antialias: true
  instance_masks: true
  max_train_samples: null
  max_val_samples: null
model:
  architecture: foundation_world
  base_channels: 24
  audio_dim: 128
  num_categories: 16
  lidar_width: 1800
  audio_sample_rate: 14700
  n_fft: 512
  hop_length: 192
  attention_heads: 4
  max_queries: 40
  query_layers: 2
  query_graph: true
  student_audio: false
  anchor_mode: observed
  source_acoustics: center
  query_stride: 4
  local_geometry: true
  geometry_checkpoint: pretrained/sonata/sonata.pth
  geometry_grid_size: 0.05
  geometry_frozen: true
  reliable_acoustics: true
loss:
  segmentation: 1.0
  dice: 2.0
  renderer: 0.05
  consistency: 0.2
  ranking: 0.05
  physical_ranking: 0.0
  balanced_focal: true
  doa: 0.1
  category: 0.1
  semantic: 0.5
  balanced_semantic: true
  position: 0.1
  smoothness: 0.0
  sparsity: 0.0
  lovasz: 0.15
  object_instances: 1.0
  object_source: 0.5
  object_reconstruction: 0.1
  audio_distillation: 0.1
  query_segmentation: 0.5
  geometry_foreground: 0.5
  boundary: 0.1
  hard_source: 0.2
training:
  stage: geometry
  seed: 1337
  epochs: 20
  batch_size: 2
  val_batch_size: 2
  gradient_accumulation: 4
  learning_rate: 0.0002
  backbone_lr_scale: 0.1
  encoder_lr_scale: 0.01
  weight_decay: 0.05
  warmup_epochs: 1
  clip_grad_norm: 1.0
  num_workers: 4
  amp: true
  require_cuda: true
  balance_categories: true
  early_stopping_patience: 6
  initialize_from: runs/revised-stable/best.pt
evaluation:
  thresholds: [0.01,0.03,0.05,0.10,0.15,0.20,0.25,0.30,0.40,0.50,0.60,0.70,0.80]
output_dir: runs/foundation-geometry-v1
