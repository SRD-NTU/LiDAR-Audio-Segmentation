data:
  root: $AUDIO_LIDAR_DATA_ROOT
  audio_stride: 3
  feature_root: cache/clap
  equivariant_augmentation: true
  antialias: true
  instance_masks: true
  max_train_samples: null
  max_val_samples: null
model:
  architecture: object_world
  base_channels: 24
  audio_dim: 128
  num_categories: 16
  lidar_width: 1800
  audio_sample_rate: 14700
  n_fft: 512
  hop_length: 192
  attention_heads: 4
  max_queries: 32
  query_layers: 2
  query_graph: true
  student_audio: false
  anchor_mode: centroid
  source_acoustics: pooled
loss:
  segmentation: 1.0
  dice: 2.0
  renderer: 0.05
  consistency: 0.2
  ranking: 0.05
  physical_ranking: 0.0
  balanced_focal: true
  doa: 0.1
  category: 0.03
  semantic: 0.25
  position: 0.1
  smoothness: 0.0
  sparsity: 0.0
  lovasz: 0.15
  object_instances: 0.5
  object_source: 0.2
  object_reconstruction: 0.1
  audio_distillation: 0.1
  query_segmentation: 0.5
training:
  seed: 1337
  epochs: 30
  batch_size: 2
  val_batch_size: 2
  gradient_accumulation: 4
  learning_rate: 0.00008
  weight_decay: 0.05
  warmup_epochs: 1
  clip_grad_norm: 1.0
  num_workers: 4
  amp: true
  require_cuda: true
  early_stopping_patience: 10
  initialize_from: runs/revised-stable/best.pt
evaluation:
  thresholds: [0.01,0.03,0.05,0.10,0.15,0.20,0.25,0.30,0.40,0.50,0.60,0.70,0.80]
output_dir: runs/object-world-v1
