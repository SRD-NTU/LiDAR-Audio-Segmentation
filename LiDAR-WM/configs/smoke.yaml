data:
  root: $AUDIO_LIDAR_DATA_ROOT
  audio_stride: 3
  max_train_samples: 4
  max_val_samples: 2

model:
  base_channels: 8
  audio_dim: 40
  num_categories: 16
  lidar_width: 1800
  audio_sample_rate: 14700
  n_fft: 128
  hop_length: 128
  attention_heads: 5

loss:
  segmentation: 1.0
  dice: 1.0
  renderer: 0.25
  consistency: 0.1
  doa: 0.15
  category: 0.1
  semantic: 0.25
  position: 0.2
  smoothness: 0.02
  sparsity: 0.02

training:
  seed: 1337
  epochs: 1
  batch_size: 1
  val_batch_size: 1
  gradient_accumulation: 1
  learning_rate: 0.0003
  weight_decay: 0.05
  warmup_epochs: 0
  clip_grad_norm: 1.0
  num_workers: 0
  amp: false
  require_cuda: false
  early_stopping_patience: 1
  resume: null

evaluation:
  thresholds: [0.3, 0.5, 0.7]

output_dir: runs/smoke
