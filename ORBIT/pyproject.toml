[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-lidar-audio-segmentation"
version = "0.2.0"
description = "ORBIT audio-prompted LiDAR segmentation"
requires-python = ">=3.10,<3.12"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["orbit", "apex", "lidarwm"]
py-modules = ["gate0_3d"]
package-dir = {"" = "runtime", "orbit" = "orbit"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
