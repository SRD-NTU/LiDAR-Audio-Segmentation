[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiolidar-seg"
version = "0.1.0"
description = "Spatial-audio LiDAR sounding-object segmentation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "torch>=2.8,<3",
]

[tool.setuptools.packages.find]
include = ["audiolidar_seg*"]
